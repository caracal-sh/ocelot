# XcodeGen spec. Generate with `make project` (or `xcodegen`).
# The .xcodeproj is a build artifact and is not committed.
name: Ocelot

options:
  bundleIdPrefix: sh.caracal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.8"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing so the app builds and runs from the CLI without a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Hardened Runtime is applied by scripts/release/sign.sh (make dmg / make release), which signs the
    # whole bundle inside-out; Xcode's own ad-hoc dev builds stay without it so the ad-hoc Sparkle.framework
    # loads (library validation needs a Team ID).
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    # Updates (Sparkle, EdDSA key `sh.caracal.ocelot`). The public key is public; Release builds carry it so local
    # `make dmg` builds are configured too. Debug builds never contact an update server.
    SPARKLE_PUBLIC_ED_KEY: ""
    # Where updates come from (UpdateConfig.swift): the GitHub repo that hosts the releases and the `updates` branch,
    # and whether it is private. YES: requests carry the user's GitHub CLI token (private repo). NO: plain public URLs,
    # no token, no preflight (the build to ship once the repo is public). scripts/release/build.sh passes both through
    # when OCELOT_UPDATE_REPO / OCELOT_UPDATE_NEEDS_AUTH are set (CI sets the repo to the repository it runs in).
    OCELOT_UPDATE_REPO: "caracal-sh/ocelot"
    OCELOT_UPDATE_NEEDS_AUTH: "NO"
  configs:
    Release:
      SPARKLE_PUBLIC_ED_KEY: "mVRQ3F306eiQltEvltbPnB3cbmmfJyiWtb6KS+hXIMY="

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Ocelot:
    type: application
    platform: macOS
    sources:
      - path: mac/Ocelot
        excludes:
          - "Generated/**"
      # Launch files and the XPC contract shared with the sandboxed agent service.
      - path: mac/AgentShared
      # Run-directory discovery, MCP routes and client configs shared with the `ocelot` CLI.
      - path: mac/Shared
      # Built editor bundle (editor/dist), copied as a folder reference to
      # Contents/Resources/dist. `make build` builds it first.
      - path: editor/dist
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Ocelot
        PRODUCT_BUNDLE_IDENTIFIER: sh.caracal.ocelot
        GENERATE_INFOPLIST_FILE: NO
        # Icon Composer document (mac/Ocelot/AppIcon.icon, generated by `make brand-generate`):
        # actool builds the macOS 26 glass icon and the legacy .icns from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: mac/Ocelot/Generated/Info.plist
      properties:
        CFBundleName: Ocelot
        CFBundleDisplayName: Ocelot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "© 2026 caracal.sh"
        CFBundleIconName: AppIcon
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ocelot Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [sh.caracal.ocelot.document]
          # Documents saved while the app was called Atelier: opened and saved in place, never renamed.
          - CFBundleTypeName: Atelier Document (legacy)
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSTypeIsPackage: true
            LSItemContentTypes: [com.caracal.atelier.document]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: sh.caracal.ocelot.document
            UTTypeDescription: Ocelot Document
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [ocelot]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.caracal.atelier.document
            UTTypeDescription: Atelier Document (legacy)
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [atelier]
        # Allows the Debug build to load the Vite dev server on 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sparkle: the EdDSA public key is a build setting (scripts/release/build.sh passes SPARKLE_PUBLIC_ED_KEY when
        # set). An empty value leaves updates unconfigured: the app never starts Sparkle and "Check for Updates…"
        # explains why (Debug builds are always unconfigured). There is no SUFeedURL: `UpdateService` supplies the feed
        # URL per check from OcelotUpdateRepo, and, when OcelotUpdateNeedsAuth is YES, the GitHub token.
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        OcelotUpdateRepo: $(OCELOT_UPDATE_REPO)
        OcelotUpdateNeedsAuth: $(OCELOT_UPDATE_NEEDS_AUTH)
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: mac/Ocelot/Generated/Ocelot.entitlements
      properties:
        # Not sandboxed: the Claude sidebar runs the user's Claude Code CLI, which
        # needs its own install, ~/.claude and the login keychain. A sandboxed
        # child process inherits the sandbox and can reach none of them.
        com.apple.security.app-sandbox: false
    dependencies:
      # The sandboxed agent service: Contents/XPCServices/sh.caracal.ocelot.AgentService.xpc
      - target: OcelotAgentService
        embed: true
        codeSign: true
      # The `ocelot` command-line tool: Contents/Helpers/ocelot ("Install command-line tool" links it into ~/.local/bin).
      - target: OcelotCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Sparkle 2 (updates): embedded in Contents/Frameworks. Update checks are the one documented network
      # exception besides the agent and image generation. Tools (generate_appcast) come
      # from the same package checkout (scripts/release/sparkle-tools.sh).
      - package: Sparkle
    scheme:
      testTargets:
        - OcelotTests
        - OcelotCLITests
      environmentVariables:
        # Debug runs from Xcode load the Vite dev server. Unset it to use the bundle.
        OCELOT_DEV_URL: http://127.0.0.1:5173

  # `ocelot`: Foundation-only command-line tool (ls/open/token/mcp/call/export/...). `Run/` is the container runtime.
  OcelotCLI:
    type: tool
    platform: macOS
    sources:
      - path: mac/OcelotCLI
      - path: mac/Shared
    settings:
      base:
        PRODUCT_NAME: ocelot
        # `ocelot` would collide with Ocelot.swiftmodule on case-insensitive volumes.
        PRODUCT_MODULE_NAME: OcelotCLI
        PRODUCT_BUNDLE_IDENTIFIER: sh.caracal.ocelot.cli
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Owns the sidebar agent's omp process inside the App Sandbox: it can read omp's install
  # directory and its own container, nothing of the user's home (no ~/.omp, ~/.ssh, ~/Documents).
  OcelotAgentService:
    type: xpc-service
    platform: macOS
    sources:
      - path: mac/OcelotAgentService
        excludes:
          - "Generated/**"
      - path: mac/AgentShared
    settings:
      base:
        PRODUCT_NAME: sh.caracal.ocelot.AgentService
        PRODUCT_BUNDLE_IDENTIFIER: sh.caracal.ocelot.AgentService
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: mac/OcelotAgentService/Generated/Info.plist
      properties:
        CFBundleName: OcelotAgentService
        CFBundleDisplayName: Ocelot Agent Sandbox
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        XPCService:
          ServiceType: Application
          RunLoopType: NSRunLoop
    entitlements:
      path: mac/OcelotAgentService/Generated/OcelotAgentService.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Model calls go to the loopback gateway; App Sandbox cannot restrict egress beyond on/off.
        com.apple.security.network.client: true
        # omp's install directory, read-only (`bun install -g`, ~/.local/bin, Homebrew, /usr/local),
        # and omp's unpacked native addon (~/.omp/natives: a sandboxed process cannot unpack its own, files it
        # writes are quarantined). Everything else under the home directory, including ~/.omp/agent where the
        # credentials are, stays unreadable.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.bun/
          - /.local/bin/
          - /.omp/natives/
        # The agent's TMPDIR: the app unpacks omp's helper dylib here (unquarantined); the sandbox reuses it.
        # Nothing of the saved conversations (`Agent/conversations/`, `Agent/history/`) is reachable: omp works on a private copy
        # of its own conversation's session files in this service's container, which the app copies in and out (`AgentSessionSync`).
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Ocelot/Agent/tmp/
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /opt/homebrew/
          - /usr/local/

  # CLI logic (arguments, resolver, stdio proxy) without the app: sources compiled directly, main.swift left out.
  OcelotCLITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: mac/OcelotCLITests
      - path: mac/OcelotCLI
        excludes:
          - main.swift
      - path: mac/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.caracal.ocelot.clitests
        GENERATE_INFOPLIST_FILE: YES

  OcelotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: mac/OcelotTests
      # Foundation-only `ocelot run` runtime (CLI); compiled into the tests so it is unit-tested without Docker.
      - path: mac/OcelotCLI/Run
      - path: mac/Shared
    dependencies:
      - target: Ocelot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.caracal.ocelot.tests
        GENERATE_INFOPLIST_FILE: YES
